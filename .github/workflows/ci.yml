name: Recipe checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install controller dependencies
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run unit and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q scripts tests
      - name: Validate Ansible syntax
        run: ansible-playbook -i ansible/inventory.example.ini ansible/playbook.yml --syntax-check
      - name: Check whitespace
        run: git diff --check
